name: elegant-stack

x-app: &app
  build: .
  image: elegant-stack:dev

services:
  api:
    <<: *app
    command: sh -c "cd apps/api && bun run dev"
    environment:
      API_PORT: 3002
      DB_FILE_NAME: /data/api.db
    ports:
      - "3002:3002"
    volumes:
      - api-data:/data

  web:
    <<: *app
    command: sh -c "cd apps/web && bunx vite dev --port 3000 --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - api

  docs:
    <<: *app
    command: sh -c "cd apps/docs && bunx vite dev --port 3001 --host 0.0.0.0"
    ports:
      - "3001:3001"

volumes:
  api-data:
